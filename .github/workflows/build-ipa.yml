name: Build unsigned Spot IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes and features (location fix, metres, arrow, Maps link)
        run: |
          python3 - <<'PY'
          import sys

          def load(p):
              return open(p, encoding="utf-8").read()

          def save(p, s):
              open(p, "w", encoding="utf-8").write(s)

          def must_replace(s, old, new, label):
              if old not in s:
                  print("PATTERN NOT FOUND (" + label + "):\n" + old)
                  sys.exit(1)
              return s.replace(old, new, 1)

          # ---------------------------------------------------------------- 1) location bug fix
          p = "Spot/DataProcessing/Firebase/FcmPushReceiver.swift"
          s = load(p)
          if "fcmHeaderParam" not in s:
              s = must_replace(s,
                  'let cryptoKey = String(appDataByKey(msg: msg, key: "crypto-key").dropFirst(3)) // strip dh=',
                  'let cryptoKey = fcmHeaderParam(appDataByKey(msg: msg, key: "crypto-key", doNotRaise: true), "dh")',
                  "crypto-key")
              s = must_replace(s,
                  'let salt = String(appDataByKey(msg: msg, key: "encryption").dropFirst(5)) // strip salt=',
                  'let salt = fcmHeaderParam(appDataByKey(msg: msg, key: "encryption", doNotRaise: true), "salt")',
                  "salt")
              s = must_replace(s,
                  'let subtype = appDataByKey(msg: msg, key: "subtype")',
                  'let subtype = appDataByKey(msg: msg, key: "subtype", doNotRaise: true)\n'
                  '        if cryptoKey.isEmpty || salt.isEmpty { return }',
                  "subtype")
              s += '''
          // Google's push headers can carry several params, e.g. "dh=<key>;p256ecdsa=<key>".
          // Return only the value of the named param (fixes location never loading).
          func fcmHeaderParam(_ header: String, _ name: String) -> String {
              for part in header.split(whereSeparator: { $0 == ";" || $0 == "," }) {
                  let kv = part.split(separator: "=", maxSplits: 1, omittingEmptySubsequences: false)
                  if kv.count == 2, kv[0].trimmingCharacters(in: .whitespaces).lowercased() == name {
                      return kv[1].trimmingCharacters(in: .whitespaces)
                  }
              }
              return ""
          }
          '''
              save(p, s)
              print("1) patched FcmPushReceiver.swift (location fix)")
          else:
              print("1) FcmPushReceiver.swift already patched")

          # ---------------------------------------------------------------- 2) meters on Precision Finding
          p = "Spot/View/DeviceView/PrecisionFindingView.swift"
          s = load(p)
          if "spotEstimatedDistanceText" not in s:
              s = must_replace(s, "import SwiftUI\n", "import SwiftUI\nimport Foundation\n", "import")
              s = must_replace(s,
                  "            Group {\n                if notReachable {",
                  "            if !notReachable && Double(rssi) > Constants.worstRSSI {\n"
                  "                Text(spotEstimatedDistanceText(rssi: Double(rssi)))\n"
                  "                    .font(.system(size: 44, weight: .bold, design: .rounded))\n"
                  "                    .foregroundColor(textColor)\n"
                  "                    .padding(.top, 8)\n"
                  "            }\n"
                  "\n"
                  "            Group {\n                if notReachable {",
                  "precision Group")
              s += '''
          /// Rough distance from Bluetooth signal strength (log-distance path loss).
          /// The ESP32 has no UWB chip, so this is an estimate (a few metres off is normal).
          /// Calibrate: hold the phone 1 m from the tag and set spotRssiAt1m to the RSSI you see.
          let spotRssiAt1m: Double = -59
          let spotPathLossExponent: Double = 2.2

          func spotEstimatedDistanceText(rssi: Double) -> String {
              let meters = pow(10.0, (spotRssiAt1m - rssi) / (10.0 * spotPathLossExponent))
              if meters < 0.5 { return "Here" }
              if meters < 1.0 { return "< 1 m" }
              if meters < 10.0 { return String(format: "~%.1f m", meters) }
              return String(format: "~%.0f m", meters)
          }
          '''
              save(p, s)
              print("2) patched PrecisionFindingView.swift (distance in metres)")
          else:
              print("2) PrecisionFindingView.swift already patched")

          # ---------------------------------------------------------------- 3) arrow + distance to last location, Google Maps link
          p = "Spot/View/DeviceView/DetailLocationView.swift"
          s = load(p)
          if "SpotNavigateSection" not in s:
              s = must_replace(s, "import SwiftUI\n", "import SwiftUI\nimport CoreLocation\n", "import")
              anchor = ('                    CustomPickerLabel(selection: (report.accuracy?.description ?? "-") + " m", '
                        'backgroundColor: .yellow, description: "Accuracy", imageName: "mappin.and.ellipse", isLink: false)\n'
                        '                }\n')
              s = must_replace(s, anchor, anchor +
                  "\n"
                  "                if let loc = report.decryptedLocation {\n"
                  "                    SpotNavigateSection(target: CLLocationCoordinate2D(latitude: loc.latitude, longitude: loc.longitude))\n"
                  "\n"
                  "                    if let url = URL(string: \"https://www.google.com/maps/search/?api=1&query=\\(loc.latitude),\\(loc.longitude)\") {\n"
                  "                        CustomSection {\n"
                  "                            Link(destination: url) {\n"
                  "                                CustomPickerLabel(selection: \"Open\", backgroundColor: .red, description: \"Google Maps\", imageName: \"map.fill\", isLink: true)\n"
                  "                            }\n"
                  "                        }\n"
                  "                    }\n"
                  "                }\n",
                  "accuracy section")
              s += '''
          // MARK: - Navigate to the last reported location (arrow + live distance)

          final class SpotNavProvider: NSObject, ObservableObject, CLLocationManagerDelegate {
              private let manager = CLLocationManager()
              @Published var location: CLLocation?
              @Published var heading: Double?

              override init() {
                  super.init()
                  manager.delegate = self
                  manager.desiredAccuracy = kCLLocationAccuracyBest
                  manager.headingFilter = 2
              }

              func start() {
                  manager.requestWhenInUseAuthorization()
                  manager.startUpdatingLocation()
                  if CLLocationManager.headingAvailable() {
                      manager.startUpdatingHeading()
                  }
              }

              func stop() {
                  manager.stopUpdatingLocation()
                  manager.stopUpdatingHeading()
              }

              func locationManager(_ manager: CLLocationManager, didUpdateLocations locations: [CLLocation]) {
                  let last = locations.last
                  DispatchQueue.main.async { self.location = last }
              }

              func locationManager(_ manager: CLLocationManager, didUpdateHeading newHeading: CLHeading) {
                  let h = newHeading.trueHeading >= 0 ? newHeading.trueHeading : newHeading.magneticHeading
                  DispatchQueue.main.async { self.heading = h }
              }
          }

          struct SpotNavigateSection: View {
              let target: CLLocationCoordinate2D
              @StateObject private var nav = SpotNavProvider()

              var body: some View {
                  CustomSection(header: "Navigate") {
                      VStack(spacing: 10) {
                          if let here = nav.location {
                              let dist = here.distance(from: CLLocation(latitude: target.latitude, longitude: target.longitude))
                              let brg = spotBearingDegrees(from: here.coordinate, to: target)
                              let turn = brg - (nav.heading ?? 0)

                              Image(systemName: "location.north.fill")
                                  .font(.system(size: 64, weight: .bold))
                                  .foregroundColor(.blue)
                                  .rotationEffect(.degrees(turn))
                                  .animation(.easeInOut(duration: 0.3), value: turn)

                              Text(spotDistanceString(dist))
                                  .font(.system(size: 34, weight: .bold, design: .rounded))

                              Text(spotCompassName(brg) + " \\u{00B7} " + String(Int(brg)) + "\\u{00B0}" + (nav.heading == nil ? " (no compass)" : ""))
                                  .foregroundColor(.secondary)
                          } else {
                              Text("Getting your location...")
                                  .foregroundColor(.secondary)
                          }
                      }
                      .frame(maxWidth: .infinity)
                      .padding()
                  }
                  .onAppear { nav.start() }
                  .onDisappear { nav.stop() }
              }
          }

          func spotBearingDegrees(from a: CLLocationCoordinate2D, to b: CLLocationCoordinate2D) -> Double {
              let lat1 = a.latitude * .pi / 180
              let lat2 = b.latitude * .pi / 180
              let dLon = (b.longitude - a.longitude) * .pi / 180
              let y = sin(dLon) * cos(lat2)
              let x = cos(lat1) * sin(lat2) - sin(lat1) * cos(lat2) * cos(dLon)
              let deg = atan2(y, x) * 180 / .pi
              return (deg + 360).truncatingRemainder(dividingBy: 360)
          }

          func spotCompassName(_ deg: Double) -> String {
              let names = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"]
              return names[Int((deg + 22.5) / 45) % 8]
          }

          func spotDistanceString(_ meters: CLLocationDistance) -> String {
              if meters < 1000 {
                  return String(format: "%.0f m away", meters)
              }
              return String(format: "%.2f km away", meters / 1000)
          }
          '''
              save(p, s)
              print("3) patched DetailLocationView.swift (arrow, distance, Google Maps link)")
          else:
              print("3) DetailLocationView.swift already patched")

          print("All patches applied.")
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, for real iPhone)
        run: |
          xcodebuild -project Spot.xcodeproj -scheme Spot -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Spot-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spot-unsigned-ipa
          path: Spot-unsigned.ipa
