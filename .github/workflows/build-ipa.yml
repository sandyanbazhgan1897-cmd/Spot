name: Build unsigned Spot IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, for real iPhone)
        run: |
          xcodebuild -project Spot.xcodeproj -scheme Spot -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Spot-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Spot-unsigned-ipa
          path: Spot-unsigned.ipa
